<link rel="stylesheet" type="text/css" href="widgets/sonos/css/style.css?v=4.2.1g8"/>
<style>
.sonos-ctrl-cluster{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 4px;border-radius:16px;max-width:100%}
.sonos-ctrl-chip-crown{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
</style>
<script type="text/javascript" src="widgets/sonos/js/sonos.js?v=4.2.1g8"></script>

<script id="tplSonosControl"
        type="text/ejs"
        class="vis-tpl"
        data-vis-set="sonos"
        data-vis-type="ctrl,val,player"
        data-vis-name="Sonos Control"
        data-vis-update-style="true"
        data-vis-attrs="oid[sonos.0]/id;theme[dark]/select,dark,light,midnight;"
        data-vis-prev='<div id="prev_tplSonosControl" style="position: relative; text-align: initial; padding: 4px"><div class="vis-widget_prev" style="width: 220px; height: 92px; background: #141414; color: #fff; border-radius: 10px; padding: 10px; font-family: Arial, sans-serif"><div style="font-weight: 800; letter-spacing: .12em; background: linear-gradient(90deg, #ff8a3d, #e31c23); -webkit-background-clip: text; background-clip: text; color: transparent">SONOS</div><div style="margin-top: 8px; font-size: 12px; color: #bbb">Rooms · Groups · Favorites</div></div></div>'>
    <div class="vis-widget <%== this.data.attr('class') %>" style="overflow: hidden; width: 935px; height: 520px; background: transparent;" id="<%= this.data.attr('wid') %>">
        <div class="vis-widget-body sonos-ctrl" style="padding: 12px; color: #f3f3f3;">Sonos</div><%
        try {
            if (vis.binds && vis.binds.sonos && vis.binds.sonos.createWidget) {
                vis.binds.sonos.createWidget(this.data.wid, this.view, this.data, this.style);
            }
        } catch (e) {
            console.error('sonos widget: ' + (e && e.message ? e.message : e));
        }
    %></div>
</script>
